name: Fuzz Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Run extended fuzzing weekly on Sunday at 2am UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Fuzz duration per test (e.g., 30s, 5m)"
        type: string
        required: false
        default: "1m"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      go: "1.27"

    steps:
      - parallel:
          - name: Checkout code
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false

          - name: Set fuzz duration
            id: fuzz-config
            env:
              INPUT_FUZZ_TIME: ${{ github.event.inputs.fuzz_time }}
              EVENT_NAME: ${{ github.event_name }}
              REF: ${{ github.ref }}
            run: |
              if [ -n "$INPUT_FUZZ_TIME" ]; then
                echo "FUZZ_TIME=$INPUT_FUZZ_TIME" >> $GITHUB_ENV
              elif [ "$EVENT_NAME" = "schedule" ]; then
                echo "FUZZ_TIME=2m" >> $GITHUB_ENV
              elif [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
                echo "FUZZ_TIME=30s" >> $GITHUB_ENV
              else
                # For PRs, just validate seed corpus (no extended fuzzing)
                echo "FUZZ_TIME=0" >> $GITHUB_ENV
              fi

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.go }}

      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build/fuzz
            **/testdata/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('**/*_fuzz_test.go') }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Validate seed corpus (PRs only)
        if: env.FUZZ_TIME == '0'
        run: |
          echo "Validating fuzz test seed corpus..."
          go test -run='^Fuzz' -tags=unittest ./common/

      - parallel:
          # Encryption fuzz tests (security-critical)
          - name: Fuzz FuzzEncryptDecryptRoundTrip
            if: env.FUZZ_TIME != '0'
            run: go test -run='^$' -fuzz=FuzzEncryptDecryptRoundTrip -fuzztime="$FUZZ_TIME" -tags=unittest ./common/

          - name: Fuzz FuzzDecryptMalformed
            if: env.FUZZ_TIME != '0'
            run: go test -run='^$' -fuzz=FuzzDecryptMalformed -fuzztime="$FUZZ_TIME" -tags=unittest ./common/

          # Path fuzz tests
          - name: Fuzz FuzzNormalizeObjectName
            if: env.FUZZ_TIME != '0'
            run: go test -run='^$' -fuzz=FuzzNormalizeObjectName -fuzztime="$FUZZ_TIME" -tags=unittest ./common/

          - name: Fuzz FuzzJoinUnixFilepath
            if: env.FUZZ_TIME != '0'
            run: go test -run='^$' -fuzz=FuzzJoinUnixFilepath -fuzztime="$FUZZ_TIME" -tags=unittest ./common/

      - name: Save fuzz corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build/fuzz
            **/testdata/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('**/*_fuzz_test.go') }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-artifacts-${{ github.sha }}
          path: |
            **/testdata/fuzz/*/crash-*
            **/testdata/fuzz/*/leak-*
          if-no-files-found: ignore
          retention-days: 30
