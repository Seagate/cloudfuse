name: Weekly Live GitHub API Check
permissions: {}

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-github-release-api-check:
    name: Live GitHub Release API Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      go: "1.27"
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.go }}
          check-latest: true

      - name: Run live release API contract test
        run: go test -v ./cmd --tags=liveapi -run TestLiveGitHubReleaseAPI -count=1
