name: Weekly Live GitHub API Check
permissions:
  contents: read

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-github-release-api-check:
    name: Live GitHub Release API Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      go: "1.27"
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.go }}

      - name: Run live release API contract test
        run: go test -v ./cmd --tags=liveapi -run TestLiveGitHubReleaseAPI -count=1
